                <p class="letter__lead">Сонце, я скучив.<br><br>Хочу провести з тобою один вечір, тому придумав його спеціально для тебе.</p>
                <p class="letter__mono">Субота, 18:00</p>
                <div class="letter__mono">
                  <p>Таксі приїде за тобою о 17:30.</p>
                  <p class="letter__gap">Якщо захочеш, одягнись так, ніби йдеш на вечерю в Парижі, буде авторське меню.</p>
                </div>
                <p class="letter__mono">Твій Яра</p>
                <button class="letter__agree" id="agree" type="button">Я ЗГОДНА</button>
              </article>
            </div>
          </div>

          <img class="env-left" src="assets/left.svg" alt="" draggable="false">
          <img class="env-right" src="assets/right.svg" alt="" draggable="false">
          <img class="env-bottom" src="assets/bottom.svg" alt="" draggable="false">

          <!-- "up side 1" — зовнішній бік клапана, "up side 2" — внутрішній, видно після перевороту -->
          <div class="flap" id="flap">
            <div class="flap__face flap__front">
              <img src="assets/flap-front.svg" alt="" draggable="false">
              <div class="seal" id="seal">
                <img class="seal__outer" src="assets/seal-outer.svg" alt="" draggable="false">
                <img class="seal__inner" src="assets/seal-inner.svg" alt="" draggable="false">
                <img class="seal__print" src="assets/fingerprint.svg" alt="" draggable="false">
              </div>
            </div>
            <div class="flap__face flap__back">
              <img src="assets/flap-back.svg" alt="" draggable="false">
            </div>
          </div>
        </div>

        <button class="envelope__hit" id="open" type="button" aria-label="Відкрити конверт"></button>
      </div>
    </div>

    <button class="close" id="close" type="button" aria-label="Закрити конверт">
      <img class="close__seal" src="assets/close-seal.svg" alt="" draggable="false">
      <img class="close__x" src="assets/close-x.svg" alt="" draggable="false">
    </button>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/gsap.min.js"></script>
  <script src="main.js"></script>
</body>
</html>
